
name: Build My Day APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'My_Day_Full_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q My_Day_Full_Android_Project.zip -d project
          test -f project/settings.gradle
          test -d project/app

      - name: Fix Java Kotlin version mismatch
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' project/app/build.gradle
          
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Day-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
